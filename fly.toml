# fly.toml app configuration file generated for slsq-sport-dashboard on 2026-10-19T08:57:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'slsq-sport-dashboard'
primary_region = 'syd'

[build]

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'sport_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
