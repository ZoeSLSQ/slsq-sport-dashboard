# DEV app. Completely separate from the membership dashboard app and volume.
app = "slsq-sport-dev"
primary_region = "syd"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  # Open viewing: no login to view. Remove this line (and add passwords) to lock the site.
  OPEN_VIEWING = "yes"
  # Optional: switch on the live membership link (read only).
  # MEMBERSHIP_API_URL = "https://slsq-membership-dashboard.fly.dev/api/data"

[[mounts]]
  source = "sport_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
